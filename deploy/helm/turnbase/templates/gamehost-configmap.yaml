apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gamehost
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: "local"
  MANAGEMENT_SERVER_PORT: {{ .Values.gamehost.managementPort | quote }}
  # <service-name>:<port> — local-environment.md §7.8 (IMP-GATE-09). platform is this chart's
  # own Platform Monolith Service.
  TURNBASE_GAMEHOST_ORCHESTRATION_ADDRESS: "{{ .Release.Name }}-platform:{{ .Values.platform.containerPort }}"
