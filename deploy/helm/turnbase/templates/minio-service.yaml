apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "turnbase.selectorLabels" (dict "component" "minio" "root" .) | nindent 4 }}
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
