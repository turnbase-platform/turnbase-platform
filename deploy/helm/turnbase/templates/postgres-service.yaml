apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "turnbase.selectorLabels" (dict "component" "postgres" "root" .) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
