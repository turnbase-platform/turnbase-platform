apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "turnbase.selectorLabels" (dict "component" "redis" "root" .) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
