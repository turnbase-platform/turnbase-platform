apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ required "minio.rootUser must be set — see values-local.secrets.example.yaml" .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "minio.rootPassword must be set — see values-local.secrets.example.yaml" .Values.minio.rootPassword | quote }}
