apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-gamehost
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
type: Opaque
# Exactly what the Game Host needs and no more: no JWT key set, no admin login, no database
# password. The Game Host reads the host registry in Redis and downloads bundles with the
# bucket-scoped credential (IMP-M10-21), never the MinIO root pair.
stringData:
  SPRING_DATA_REDIS_PASSWORD: {{ required "redis.password must be set — see values-local.secrets.example.yaml" .Values.redis.password | quote }}
  TURNBASE_ARTIFACT_STORE_ACCESS_KEY: {{ required "minio.appAccessKey must be set — see values-local.secrets.example.yaml" .Values.minio.appAccessKey | quote }}
  TURNBASE_ARTIFACT_STORE_SECRET_KEY: {{ required "minio.appSecretKey must be set — see values-local.secrets.example.yaml" .Values.minio.appSecretKey | quote }}
