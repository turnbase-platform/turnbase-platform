apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ required "postgres.appPassword must be set — see values-local.secrets.example.yaml" .Values.postgres.appPassword | quote }}
  TURNBASE_ARTIFACT_STORE_ACCESS_KEY: {{ required "minio.rootUser must be set — see values-local.secrets.example.yaml" .Values.minio.rootUser | quote }}
  TURNBASE_ARTIFACT_STORE_SECRET_KEY: {{ required "minio.rootPassword must be set — see values-local.secrets.example.yaml" .Values.minio.rootPassword | quote }}
  # secrets-and-configuration.md §3.1 (IMP-GATE-15/16) — required because
  # TURNBASE_JWT_KEY_SET_REQUIRED is "true" in platform-configmap.yaml.
  TURNBASE_JWT_KEY_SET: {{ required "auth.jwtKeySet must be set — see values-local.secrets.example.yaml" .Values.auth.jwtKeySet | quote }}
  TURNBASE_ADMIN_USERNAME: {{ required "admin.username must be set — see values-local.secrets.example.yaml" .Values.admin.username | quote }}
  TURNBASE_ADMIN_PASSWORD: {{ required "admin.password must be set — see values-local.secrets.example.yaml" .Values.admin.password | quote }}
  # secrets-and-configuration.md §5: absent by default, and the platform starts anyway — no
  # `required` guard, unlike every secret above.
  TURNBASE_OAUTH_GOOGLE_CLIENT_ID: {{ .Values.oauth.google.clientId | default "" | quote }}
  TURNBASE_OAUTH_GOOGLE_CLIENT_SECRET: {{ .Values.oauth.google.clientSecret | default "" | quote }}
