apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.ownerUser | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.ownerPassword must be set — see values-local.secrets.example.yaml" .Values.postgres.ownerPassword | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  # Read by 01-roles.sql's \getenv (secrets-and-configuration.md §4) — not consumed by the
  # postgres image itself.
  TURNBASE_DB_APP_PASSWORD: {{ required "postgres.appPassword must be set — see values-local.secrets.example.yaml" .Values.postgres.appPassword | quote }}
