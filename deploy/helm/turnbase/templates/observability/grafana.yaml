{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: {{ required "observability.grafana.adminPassword must be set — see values-local.secrets.example.yaml" .Values.observability.grafana.adminPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-datasources
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
data:
  # Identical to deploy/compose/grafana/datasources/datasources.yaml, verbatim (observability.md
  # §5) — the derived field is what turns a log line's traceId into a link to the Tempo trace.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prom
        url: http://{{ .Release.Name }}-prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        url: http://{{ .Release.Name }}-loki:3100
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: '"traceId":"(\w+)"'
              url: "$${__value.raw}"
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://{{ .Release.Name }}-tempo:3200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboards
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
data:
  # Provider config only, identical to deploy/compose/grafana/dashboards/dashboards.yaml — the
  # dashboard JSON itself is IMP-M0-10's content.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: TurnBase
        type: file
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-grafana-data
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.observability.grafana.storage.storageClassName }}
  storageClassName: {{ .Values.observability.grafana.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.observability.grafana.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "turnbase.selectorLabels" (dict "component" "grafana" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "turnbase.selectorLabels" (dict "component" "grafana" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-grafana
          env:
            # observability.md §5: anonymous access stays off even locally — Grafana is
            # reachable from the whole LAN under compose; kept off here too rather than the
            # value silently depending on which profile is running.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: {{ .Release.Name }}-grafana-datasources
        - name: dashboards-provider
          configMap:
            name: {{ .Release.Name }}-grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "turnbase.selectorLabels" (dict "component" "grafana" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 3000
{{- end }}
