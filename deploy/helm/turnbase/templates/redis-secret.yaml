apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
type: Opaque
stringData:
  TURNBASE_REDIS_PASSWORD: {{ required "redis.password must be set — see values-local.secrets.example.yaml" .Values.redis.password | quote }}
