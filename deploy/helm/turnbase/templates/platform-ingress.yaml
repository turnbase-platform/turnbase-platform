{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    {{- include "turnbase.labels" . | nindent 4 }}
  annotations:
    # local-environment.md §4: the default 60s proxy-read-timeout closes an idle WebSocket the
    # STOMP heartbeat interval considers perfectly healthy.
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.proxyReadTimeoutSeconds | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # The platform origin is the Frontend Service (IMP-GATE-74): it serves the shell and proxies
    # /api, /ws and the two OAuth redirects to the monolith. The games origin goes straight to
    # the monolith, which routes it by Host header (local-environment.md §1). Neither rule
    # names 8081.
    - host: {{ .Values.ingress.platformHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  name: http
    - host: {{ .Values.ingress.gamesHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-platform
                port:
                  name: http
{{- end }}
