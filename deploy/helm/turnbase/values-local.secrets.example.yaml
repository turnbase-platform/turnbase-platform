# Copy to values-local.secrets.yaml (git-ignored) and fill in every value before
# `helm upgrade --install`. No default here works — secrets-and-configuration.md §2: a default
# that works is a default that reaches production. Mirrors deploy/compose/.env.example.

postgres:
  ownerPassword: ""
  appPassword: ""

redis:
  password: ""

minio:
  rootUser: ""
  rootPassword: ""

# secrets-and-configuration.md §3.1/§3.2 (IMP-GATE-15/16) — required because this chart sets
# TURNBASE_JWT_KEY_SET_REQUIRED=true. One JSON value: {"active":{"kid":"k1","secret":"<base64
# 256-bit>","notBefore":"<ISO-8601>"},"retired":[]}. Generate a secret the same way
# JwtKeySetConfig does — 32 random bytes, base64-encoded — not a password.
auth:
  jwtKeySet: ""

# secrets-and-configuration.md §1 — Basic-auth credentials for the loopback-bound admin API.
admin:
  username: ""
  password: ""

# secrets-and-configuration.md §5 — absent by default, Google login (FR-AUTH-007) is unavailable
# without it and the platform starts anyway.
oauth:
  google:
    clientId: ""
    clientSecret: ""

observability:
  grafana:
    adminPassword: ""
