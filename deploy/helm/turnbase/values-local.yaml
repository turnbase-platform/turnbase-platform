# Non-secret overrides for the inner-loop Docker Desktop Kubernetes path (local-environment.md
# §5's "canonical path"): images built locally with `docker build -t turnbase/platform:dev .`
# (and the equivalent in turnbase-game-host and turnbase-frontend), never pulled from a registry.
#
# Secrets are deliberately absent here — see values-local.secrets.example.yaml. Run:
#   helm upgrade --install turnbase deploy/helm/turnbase \
#     -f deploy/helm/turnbase/values-local.yaml \
#     -f deploy/helm/turnbase/values-local.secrets.yaml   # your git-ignored copy

platform:
  image:
    pullPolicy: Never
gamehost:
  image:
    pullPolicy: Never
frontend:
  image:
    pullPolicy: Never

# Docker Desktop's ingress-nginx listens on 80, not on the compose profile's 8080
# (local-environment.md §4), so the browser origins carry no port. The platform and the Frontend
# read both from here (values.yaml).
origins:
  platform: http://turnbase.localhost
  gameFrontendTemplate: "http://{gameId}.games.localhost"
