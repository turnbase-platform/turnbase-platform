# Defaults for the canonical local stack (local-environment.md §4, §7). Every key here has a
# counterpart in the compose profile's environment: block or .env.example — the two express the
# same configuration surface without generating one from the other.
#
# No secret below has a working default (secrets-and-configuration.md §2: a default that works
# is a default that reaches production). Supply real values via a separate, git-ignored file —
# see values-local.secrets.example.yaml — never by editing this file or values-local.yaml.

ingress:
  enabled: true
  className: nginx
  platformHost: turnbase.localhost
  gamesHost: "*.games.localhost"
  # local-environment.md §4: raised well above the STOMP heartbeat interval, because the
  # default 60s closes an idle WebSocket the protocol considers healthy.
  proxyReadTimeoutSeconds: 3600

# local-environment.md §7.7. One source for both the monolith's `turnbase.platform.origin` /
# `turnbase.game-frontend.origin-template` and the Frontend container's copy of them — the two
# must agree, so neither configmap carries its own literal. Different registrable domains (ADR-0007).
origins:
  platform: http://turnbase.localhost:8080
  gameFrontendTemplate: "http://{gameId}.games.localhost:8080"

frontend:
  image:
    repository: turnbase/frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 8080
  resources: {}

platform:
  image:
    repository: turnbase/platform
    tag: dev
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 8080
  managementPort: 8081
  resources: {}
  db:
    # IMP-M17-03, FR-DBQ-005: spring.datasource.hikari.maximum-pool-size, per environment.
    poolMaxSize: 10
  # Extra container env entries ({name, value} or {name, valueFrom}); they win over the ConfigMap.
  # The load-test overlay (load-testing.md A1) uses it for SPRING_PROFILES_ACTIVE.
  extraEnv: []
  # local-environment.md §6 (IMP-GATE-71, IMP-M3-10): directory of `<gameId>.zip` official-game
  # bundles the seeder uploads under the `local` profile. Empty = none mounted, no games seeded.
  # A hostPath, so it only means something on the single-node Docker Desktop cluster; set it in
  # values-local.yaml to the absolute path of turnbase-game-tictactoe/target/seed.
  seed:
    bundlesHostPath: ""
  autoscaling:
    # NFR-SCALE-001 defers multi-instance deployment post-MVP; the template exists so turning
    # this on later is a values change, not a new template. Do not enable it against the
    # single-replica assumption ADR-0008 §"Relationship to the deferred multi-instance scope"
    # documents.
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # autoscaling/v2 `behavior`, rendered as is. Empty keeps the controller defaults. With the HPA on,
    # the Deployment omits `replicas` (the HPA owns it).
    behavior: {}

gamehost:
  image:
    repository: turnbase/game-host
    tag: dev
    pullPolicy: IfNotPresent
  replicaCount: 1
  grpcPort: 9090
  managementPort: 8081
  resources: {}
  # As platform.extraEnv.
  extraEnv: []

postgres:
  image: postgres:16-alpine
  database: turnbase
  ownerUser: turnbase_owner
  # Populated from a git-ignored secrets file — see values-local.secrets.example.yaml.
  ownerPassword: ""
  appUser: turnbase_app
  appPassword: ""
  # Container resources; the load-test overlay (load-testing.md A1) pins requests == limits.
  resources: {}
  # Server settings, rendered as `-c name=value` before extraArgs. Sized for the Phase B 4 CPU / 2 GiB
  # (local-environment.md §7.9, FR-DBQ-007): shared_buffers 25% of memory, max_connections above
  # platform.maxReplicas x the pool (3 x 10) with room for migrations and operators, and the
  # worker settings at the core count.
  settings:
    shared_buffers: 512MB
    effective_cache_size: 1GB
    max_connections: 50
    max_wal_size: 2GB
    checkpoint_completion_target: "0.9"
    random_page_cost: "1.1"
    max_worker_processes: 4
    max_parallel_workers: 4
    max_parallel_workers_per_gather: 2
    max_parallel_maintenance_workers: 2
  # Extra arguments for the image's entrypoint, e.g. ["-c", "log_checkpoints=on"]. Empty in production;
  # the load-test overlay uses it to load pg_stat_statements.
  extraArgs: []
  storage:
    size: 2Gi
    storageClassName: ""

redis:
  image: redis:7-alpine
  password: ""
  # As postgres.resources.
  resources: {}
  # Appended to redis-server's arguments after the required ones (noeviction, appendonly, requirepass).
  extraArgs: []
  storage:
    size: 1Gi
    storageClassName: ""

minio:
  image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
  mcImage: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
  rootUser: ""
  rootPassword: ""
  # The scoped service credential (IMP-M10-21), provisioned by the minio-init Job and limited to
  # `bucket` by the policy in templates/minio-policy-configmap.yaml. Must differ from the root pair.
  appAccessKey: ""
  appSecretKey: ""
  bucket: turnbase-bundles
  storage:
    size: 5Gi
    storageClassName: ""

auth:
  # secrets-and-configuration.md §3.1/§3.2 (IMP-GATE-15/16) — required, since this chart sets
  # TURNBASE_JWT_KEY_SET_REQUIRED=true (platform-configmap.yaml).
  jwtKeySet: ""

admin:
  username: ""
  password: ""

oauth:
  google:
    # secrets-and-configuration.md §5: absent by default, Google login is unavailable without it
    # and the platform starts anyway.
    clientId: ""
    clientSecret: ""

observability:
  enabled: true
  prometheus:
    image: prom/prometheus:v3.14.0
    # Accept pushed samples at /api/v1/write (load-testing.md A1: k6 remote write). Off by default.
    remoteWriteReceiver: false
    storage:
      size: 2Gi
      storageClassName: ""
  grafana:
    image: grafana/grafana:13.2.1
    adminPassword: ""
    storage:
      size: 1Gi
      storageClassName: ""
  loki:
    image: grafana/loki:3.6.16
    storage:
      size: 2Gi
      storageClassName: ""
  tempo:
    image: grafana/tempo:2.10.8
    storage:
      size: 2Gi
      storageClassName: ""
  promtail:
    image: grafana/promtail:3.6.11
  alertmanager:
    image: prom/alertmanager:v0.34.0
    # Absent by default (observability.md §6): rules still evaluate with no receiver
    # configured, only delivery is missing until this is set.
    webhookUrl: ""
