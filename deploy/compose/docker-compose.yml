# Local stack, core profile (IMP-M0-07, local-environment.md §1). Quick-start path; the
# Kubernetes/Helm chart (IMP-M0-08) is canonical (local-environment.md §4, ADR-0001 §2).
#
# `platform` builds from this repo's own Dockerfile — same repo, no path outside it. `gamehost`
# has no `build:` block: turnbase-game-host is a sibling submodule and ADR-0012 requires every
# component repo to stay independently usable without the root, so this repo never reads a path
# outside itself. Build it separately first:
#   docker build -t turnbase/game-host:dev ../../../turnbase-game-host
#
#   docker compose up -d                 # this file alone — core profile
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d   # full

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: turnbase_owner
      POSTGRES_PASSWORD: ${TURNBASE_DB_OWNER_PASSWORD:?TURNBASE_DB_OWNER_PASSWORD is required}
      POSTGRES_DB: turnbase
      # Read by 01-roles.sql's `\getenv` (secrets-and-configuration.md §4) — not consumed by
      # the postgres image itself.
      TURNBASE_DB_APP_PASSWORD: ${TURNBASE_DB_APP_PASSWORD:?TURNBASE_DB_APP_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnbase_owner -d turnbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # noeviction + appendonly are required, not tuning (ADR-0008, room-lifecycle.md §1.5,
    # local-environment.md §2) — under any allkeys-* policy, memory pressure can evict a
    # liveness lease and permit a wrongful ownership takeover with no error anywhere.
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
        "--requirepass",
        "${TURNBASE_REDIS_PASSWORD:?TURNBASE_REDIS_PASSWORD is required}",
      ]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$TURNBASE_REDIS_PASSWORD\" PING | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      TURNBASE_REDIS_PASSWORD: ${TURNBASE_REDIS_PASSWORD:?TURNBASE_REDIS_PASSWORD is required}

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs to completion, then exits. local-environment.md §5: the bundle bucket is created by
  # this init step, not by the application — a service that creates its own bucket needs
  # bucket-creation rights it must not hold in production.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TURNBASE_ARTIFACT_STORE_BUCKET: turnbase-bundles
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$TURNBASE_ARTIFACT_STORE_BUCKET &&
      mc anonymous set none local/$$TURNBASE_ARTIFACT_STORE_BUCKET"
    restart: "no"

  platform:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: turnbase/platform:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/turnbase
      SPRING_DATASOURCE_USERNAME: turnbase_app
      SPRING_DATASOURCE_PASSWORD: ${TURNBASE_DB_APP_PASSWORD:?TURNBASE_DB_APP_PASSWORD is required}
      MANAGEMENT_SERVER_PORT: 8081
      # No MANAGEMENT_SERVER_ADDRESS override: the app listens on all interfaces in every
      # profile (local-environment.md §1, IMP-GATE-14) — a published Docker port always
      # forwards to the container's bridge interface, never its loopback, so binding the app
      # itself to 127.0.0.1 would make this unreachable through the port mapping below. The
      # host-side `127.0.0.1:8081:8081` bind is what actually restricts it.
      TURNBASE_ARTIFACT_STORE_ENDPOINT: http://minio:9000
      TURNBASE_ARTIFACT_STORE_BUCKET: turnbase-bundles
      TURNBASE_ARTIFACT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      TURNBASE_ARTIFACT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TURNBASE_ADMIN_USERNAME: ${TURNBASE_ADMIN_USERNAME:?TURNBASE_ADMIN_USERNAME is required}
      TURNBASE_ADMIN_PASSWORD: ${TURNBASE_ADMIN_PASSWORD:?TURNBASE_ADMIN_PASSWORD is required}
      # secrets-and-configuration.md §5: absent by default, and the platform starts anyway — no
      # `:?required` guard, unlike every secret above.
      TURNBASE_OAUTH_GOOGLE_CLIENT_ID: ${TURNBASE_OAUTH_GOOGLE_CLIENT_ID:-}
      TURNBASE_OAUTH_GOOGLE_CLIENT_SECRET: ${TURNBASE_OAUTH_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # No `build:` block — see the header note. Build turnbase/game-host:dev separately first.
  gamehost:
    image: turnbase/game-host:dev
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      MANAGEMENT_SERVER_PORT: 8081
      # No MANAGEMENT_SERVER_ADDRESS override — see the platform service's comment above
      # (local-environment.md §1, IMP-GATE-14).
      # <service-name>:<port> — platform is this compose project's own Platform Monolith
      # service (local-environment.md §7.8, IMP-GATE-09).
      TURNBASE_GAMEHOST_ORCHESTRATION_ADDRESS: platform:8080
    ports:
      - "127.0.0.1:8082:8081"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  minio-data:
