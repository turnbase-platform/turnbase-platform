# Single-binary local Tempo, matching local-environment.md §1's ports (4317 OTLP gRPC, 3200
# HTTP) and §7 (no long-term storage locally — filesystem, not object storage).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # Tempo's OTLP receivers default to a loopback bind address, unreachable from another
        # container even though the port is published on the network — same class of bug
        # local-environment.md §1 warns about for the management port. Found by actually
        # running the stack and exporting a real span (IMP-GATE-22).
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
