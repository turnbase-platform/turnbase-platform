# Supply-chain updates, per conventions.md §6 and platform-operations.md FR-CICD-010.
#
# FROZEN 2026-09-05. Every ecosystem below carries `open-pull-requests-limit: 0` — GitHub's
# documented switch for turning version updates off without deleting the configuration that
# describes them. Dependabot opened PRs faster than a solo project merges them, and the
# resulting backlog of open PRs and orphaned branches cost more attention than the bumps were
# worth this early. The groups and every `ignore` entry are kept deliberately: each records
# *why* a pin is a decision rather than neglect, and that reasoning outlives the freeze.
# Re-enabling is restoring the limits, nothing else.
#
# Trivy scanning is wired by IMP-M0-11 with the rest of the shared pipeline; this file is
# the half that is pure configuration and therefore cheaper to land now than to remember
# later.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # CLAUDE.md pins Spring Boot 3.5+, not 4.x. A major bump is a deliberate upgrade this
      # project hasn't made, not a routine update — closed once already (2026-09-02).
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        versions: ['>=4.0.0']
    groups:
      spring:
        patterns:
          - org.springframework.boot:*
          - org.springframework.modulith:*
      grpc:
        patterns:
          - io.grpc:*
      build-tooling:
        patterns:
          - com.diffplug.spotless:*
          - com.google.errorprone:*
          - com.uber.nullaway:*
          - org.jacoco:*
          - org.apache.maven.plugins:*
      test:
        patterns:
          - org.assertj:*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # CLAUDE.md/conventions.md pin Java 21 for every backend service. A major JRE bump is a
      # deliberate upgrade this project hasn't made — closed once already (2026-09-02).
      - dependency-name: eclipse-temurin
        versions: ['>=22']
    commit-message:
      prefix: chore
      include: scope
