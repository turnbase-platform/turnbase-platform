# Build for turnbase-platform.
#
# IMP-M0-03 stands up the build floor; IMP-M0-11 (the Trivy and GHCR-push steps below) owns
# the rest of the pipeline for all five repositories.
#
# master everywhere, never main (conventions.md §4).
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A healthy run is ~10-25 min; 2026-09-26 sat 2h14m before being cancelled by hand.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM CE 21
        # NOT actions/setup-java: it has no graalvm-community distribution and fails with
        # "No supported distribution was found for input graalvm-community". Matches the
        # .sdkmanrc pin, so CI and a developer's shell run the same JDK.
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install turnbase-common (bootstrap — conventions.md §5)
        # turnbase-common has no tagged release yet, so <turnbase-common.version> pins its
        # current development version and this runner needs it in the local repository.
        # turnbase-common is private (ADR-0012), so this needs a credential beyond the
        # workflow's own GITHUB_TOKEN — TURNBASE_COMMON_PAT is a fine-grained PAT, read-only
        # on Contents, scoped to turnbase-common only. Delete this step, not adapt it, the
        # same PR that bumps the version property to a real release once IMP-M0-11 publishes
        # one — from that point resolution is an authenticated GitHub Packages fetch instead.
        env:
          TURNBASE_COMMON_PAT: ${{ secrets.TURNBASE_COMMON_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${TURNBASE_COMMON_PAT}@github.com/${{ github.repository_owner }}/turnbase-common.git" /tmp/turnbase-common
          cd /tmp/turnbase-common
          ./mvnw --batch-mode --no-transfer-progress install -DskipTests

      - name: Install turnbase-sdk (bootstrap — conventions.md §5, IMP-GATE-70)
        # turnbase-platform depends on turnbase-bundle-validator (IMP-M3-13), built by
        # turnbase-sdk and not yet published (no tagged release), so this runner needs it in the
        # local repository. turnbase-sdk is private (ADR-0012): TURNBASE_SDK_PAT is a
        # fine-grained PAT, read-only on Contents, scoped to turnbase-sdk only. Delete this
        # step, not adapt it, the same change that bumps <turnbase-sdk.version> to a release.
        env:
          TURNBASE_SDK_PAT: ${{ secrets.TURNBASE_SDK_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${TURNBASE_SDK_PAT}@github.com/${{ github.repository_owner }}/turnbase-sdk.git" /tmp/turnbase-sdk
          cd /tmp/turnbase-sdk
          ./mvnw --batch-mode --no-transfer-progress install -DskipTests

      - name: Verify
        # Spotless runs at validate, Error Prone and NullAway during compile, the Modulith
        # verification test and JaCoCo's merged check at verify — this one command is the
        # whole Java gate for now. -Pintegration runs the Testcontainers-backed *IT suite
        # (IMP-M0-06 is the first item that needs one — a real Postgres for Flyway) so the
        # merge JaCoCo does at verify (conventions.md §3) has integration-tier data to merge;
        # without it the check runs on unit-only coverage and fails open exactly as that
        # section warns. ubuntu-latest ships Docker, so Testcontainers needs no extra setup.
        run: ./mvnw --batch-mode --no-transfer-progress verify -Pintegration

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Trivy scan — dependencies (report)
        # platform-operations.md FR-CICD-010: every finding is reported; only a critical one
        # blocks the build (the next step).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy scan — dependencies (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'

      - name: Build container image
        # The jar was already built by `./mvnw verify` above; the Dockerfile packages it
        # rather than rebuilding, so the image build never needs its own network access to
        # turnbase-common (conventions.md §5 bootstrap window, IMP-GATE-07).
        run: docker build -t turnbase/platform:ci .

      - name: Trivy scan — image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: turnbase/platform:ci
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy scan — image (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: turnbase/platform:ci
          severity: CRITICAL
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        # FR-CICD-006: tagged with the commit SHA, on every push to master. No `:latest` —
        # the requirement names only the SHA tag, and inventing a second one is a decision
        # nothing asked for.
        if: github.event_name == 'push'
        run: |
          docker tag turnbase/platform:ci ghcr.io/turnbase-platform/platform:${{ github.sha }}
          docker push ghcr.io/turnbase-platform/platform:${{ github.sha }}

  e2e:
    # FR-CICD-005, local-environment.md §8, OQ-002: post-merge only, and it gates nothing —
    # continue-on-error means a failure here never fails the workflow run. Compose is the
    # e2e tier's dependency and only there (conventions.md §3); the pre-merge `build` job
    # above never touches it.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out turnbase-game-host
        # gamehost has no `build:` block in docker-compose.yml (this repo stays
        # independently usable without the root, ADR-0012), so its image is built from a
        # sibling checkout here — the same bootstrap-PAT pattern conventions.md §5 already
        # uses for turnbase-common: a fine-grained PAT, read-only on Contents, scoped to
        # turnbase-game-host only.
        uses: actions/checkout@v7
        with:
          repository: turnbase-platform/turnbase-game-host
          token: ${{ secrets.TURNBASE_GAME_HOST_PAT }}
          path: turnbase-game-host

      - name: Check out turnbase-frontend
        # Same reasoning and pattern as turnbase-game-host above (IMP-GATE-74: the Frontend
        # container is the platform origin's listener, and its image is built from a sibling
        # checkout). Needs its own fine-grained PAT, read-only on Contents, scoped to
        # turnbase-frontend only — TURNBASE_FRONTEND_PAT must exist as a repository secret.
        uses: actions/checkout@v7
        with:
          repository: turnbase-platform/turnbase-frontend
          token: ${{ secrets.TURNBASE_FRONTEND_PAT }}
          path: turnbase-frontend

      - name: Free disk space
        # Two bootstrap installs, three Maven builds and three images (platform, game-host,
        # frontend) plus the compose stack on top of a runner that ships several multi-GB
        # toolchains this job never uses. Same step turnbase-game-host's own build.yml carries
        # for the same reason. `|| true`: not every path exists on every runner image.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Set up GraalVM CE 21
        # turnbase-game-host's own Dockerfile expects target/turnbase-game-host-*.jar to
        # already exist (it packages, it does not build) — this job builds it from the
        # sibling checkout above before e2e-smoke.sh runs `docker build` against it.
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install turnbase-common (bootstrap — conventions.md §5)
        # turnbase-game-host pins the same <turnbase-common.version> as the `build` job's
        # own bootstrap step above — but `e2e` is a separate job on its own fresh runner
        # (jobs share nothing but secrets/outputs), so that earlier install isn't visible
        # here and this step repeats it. Same secret works: it belongs to turnbase-platform
        # itself, and both jobs run in that repo's workflow.
        env:
          TURNBASE_COMMON_PAT: ${{ secrets.TURNBASE_COMMON_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${TURNBASE_COMMON_PAT}@github.com/${{ github.repository_owner }}/turnbase-common.git" /tmp/turnbase-common
          cd /tmp/turnbase-common
          ./mvnw --batch-mode --no-transfer-progress install -DskipTests

      - name: Install turnbase-sdk (bootstrap — conventions.md §5, IMP-GATE-70)
        # turnbase-game-host depends on turnbase-sdk and turnbase-serialization, both built by
        # turnbase-sdk and neither published (no tagged release), so the build below needs
        # them in this runner's local repository. One install at turnbase-sdk's root produces
        # both. turnbase-sdk is private (ADR-0012): TURNBASE_SDK_PAT is a fine-grained PAT,
        # read-only on Contents, scoped to turnbase-sdk only, stored on this repository as it
        # is on turnbase-game-host. Delete this step, not adapt it, the same change that bumps
        # turnbase-game-host's version properties to a real release.
        env:
          TURNBASE_SDK_PAT: ${{ secrets.TURNBASE_SDK_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${TURNBASE_SDK_PAT}@github.com/${{ github.repository_owner }}/turnbase-sdk.git" /tmp/turnbase-sdk
          cd /tmp/turnbase-sdk
          ./mvnw --batch-mode --no-transfer-progress install -DskipTests
          cd -
          rm -rf /tmp/turnbase-sdk

      - name: Build turnbase-game-host
        # -DskipTests: turnbase-game-host's own CI (its own repo) already runs its full
        # verify; this job only needs the jar Dockerfile:25's COPY expects.
        working-directory: turnbase-game-host
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Build turnbase-platform
        # Same "jobs share nothing" reasoning as the turnbase-common install step above:
        # `needs: build` only orders this job after `build`, it does not carry that job's
        # target/ over — this is a separate, fresh runner. Without this step,
        # e2e-smoke.sh's `docker compose up --build` fails at this Dockerfile's own
        # `COPY target/turnbase-platform-*.jar app.jar` with `lstat /target: no such file or
        # directory`, since nothing here has ever produced that jar.
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Run the e2e smoke test
        env:
          TURNBASE_GAME_HOST_DIR: ${{ github.workspace }}/turnbase-game-host
          TURNBASE_FRONTEND_DIR: ${{ github.workspace }}/turnbase-frontend
        run: make e2e
