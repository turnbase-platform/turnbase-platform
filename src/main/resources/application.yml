spring:
  application:
    name: turnbase-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8080

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    # Unset (all interfaces) in both profiles — local-environment.md §1 (IMP-GATE-14). A
    # published Docker port always forwards to the container's bridge interface, never its
    # loopback, so binding this to 127.0.0.1 under compose would make the management port
    # unreachable through its own published port; the host-side bind in docker-compose.yml is
    # what restricts it there instead. A kubelet probes the pod IP directly, so binding this to
    # 127.0.0.1 under Kubernetes would fail every readiness probe the same way.
    address: ${MANAGEMENT_SERVER_ADDRESS:}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  # local-environment.md §3: the monolith's readiness must not depend on the Game Host — a
  # Game Host restart must never fail this probe and drop every WebSocket on the platform.
  # Nothing below adds a Game Host indicator to either group, and none ever should.
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

turnbase:
  artifact-store:
    # Non-secret tunables (local-environment.md §7.9). Access/secret key have no default —
    # secrets-and-configuration.md §2: a missing secret must fail startup, never fall back.
    endpoint: ${TURNBASE_ARTIFACT_STORE_ENDPOINT:http://minio:9000}
    bucket: ${TURNBASE_ARTIFACT_STORE_BUCKET:turnbase-bundles}
    access-key: ${TURNBASE_ARTIFACT_STORE_ACCESS_KEY}
    secret-key: ${TURNBASE_ARTIFACT_STORE_SECRET_KEY}
