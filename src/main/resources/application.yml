spring:
  application:
    name: turnbase-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8080

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    # Loopback under compose, unset (all interfaces) under Kubernetes — local-environment.md
    # §1. A kubelet probes the pod IP directly, so binding this to 127.0.0.1 there would fail
    # every readiness probe. Compose sets MANAGEMENT_SERVER_ADDRESS=127.0.0.1 in its own
    # environment; Kubernetes leaves it unset.
    address: ${MANAGEMENT_SERVER_ADDRESS:}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  # local-environment.md §3: the monolith's readiness must not depend on the Game Host — a
  # Game Host restart must never fail this probe and drop every WebSocket on the platform.
  # Nothing below adds a Game Host indicator to either group, and none ever should.
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
